# ══════════════════════════════════════════════════════════════════
# SmartFinvo — Redis Deployment
#
# Runs Redis 7 Alpine — minimal, fast, secure.
#
# Two logical databases:
#   DB 0 → JWT refresh tokens (auth module)
#   DB 1 → Chat memory (AI Feature 3)
#
# No PVC needed — data is short-lived (TTL based).
# If Redis restarts: users re-login, chat resets.
# Acceptable trade-off for simplicity and cost.
# ══════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartfinvo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate          # Stop old pod then start new one
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

          # Use shell to expand environment variable
          # Redis CLI cannot read env vars directly
          command:
            - sh
            - -c
            - |
              redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --maxmemory 128mb \
                --maxmemory-policy allkeys-lru

          env:
            # Read password from Secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartfinvo-secrets
                  key: SPRING_DATA_REDIS_PASSWORD

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          # Liveness — is Redis alive?
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          # Readiness — is Redis ready for connections?
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3