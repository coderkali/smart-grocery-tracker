# ══════════════════════════════════════════════════════════════════
# SmartFinvo — Redis Service
#
# Gives Redis pod a stable internal hostname: redis-service
#
# Other pods connect using:
#   redis-service:6379
#
# Matches application.yml:
#   SPRING_DATA_REDIS_HOST: redis-service
#
# ClusterIP = internal only, never public.
# Redis must never be exposed to the internet.
# ══════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: redis-service       # Hostname other pods use
  namespace: smartfinvo
  labels:
    app: redis
spec:
  selector:
    app: redis              # Routes to pods labelled app=redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP           # Internal only