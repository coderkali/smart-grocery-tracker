# ══════════════════════════════════════════════════════════════════
# SmartFinvo — Application Service
#
# type: LoadBalancer creates an AWS Classic Load Balancer.
# No annotations needed — Kubernetes handles it automatically.
# ══════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: smartfinvo-service
  namespace: smartfinvo
  labels:
    app: smartfinvo
spec:
  selector:
    app: smartfinvo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer