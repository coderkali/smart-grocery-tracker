version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "274214919013"
    AWS_DEFAULT_REGION: "us-east-2"
    IMAGE_REPO_NAME: "smartfinvo"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - echo "=== PRE-BUILD PHASE ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Image will be tagged as: $IMAGE_TAG"

  build:
    commands:
      - echo "=== BUILD PHASE ==="
      - echo "Building Maven project..."
      - mvn clean install -DskipTests
      - echo "Running unit tests..."
      - mvn test
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "=== POST-BUILD PHASE ==="
      - echo "Pushing Docker image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Writing image definitions file..."
      - printf '[{"name":"smartfinvo","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo "Running pre-deploy health check..."
      - bash scripts/deploy/pre-deploy-health-check.sh
      - echo "Health check passed! Safe to deploy."
