spring:
  application:
    name: smartfinvo

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_secret}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid, email, profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ── Database ────────────────────────────────────────────────────
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_grocery}
    username: ${DB_USER:grocery_user}
    password: ${DB_PASSWORD:grocery_secret}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  # ── Flyway ──────────────────────────────────────────────────────
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_grocery}
    user: ${DB_USER:grocery_user}
    password: ${DB_PASSWORD:grocery_secret}
    locations:
      - classpath:db/migration/system
      - classpath:db/migration/auth
      - classpath:db/migration/user
      - classpath:db/migration/expense
      - classpath:db/migration/notification
      - classpath:db/migration/cardsync
      - classpath:db/migration/ai
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: false

  # ── Spring AI ───────────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 1000
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

    chat:
      memory:
        redis:
          key-prefix: "chat_memory:"
          ttl: 3600

  # ── JDBC DataSource (Flyway + pgvector) ─────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_grocery}
    username: ${DB_USER:grocery_user}
    password: ${DB_PASSWORD:grocery_secret}
    driver-class-name: org.postgresql.Driver

# ── SpringDoc / Swagger ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: false

# ── App Config ──────────────────────────────────────────────────────
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-key-must-be-at-least-64-chars-long-for-hs512-algo!}
    access-token-expiry-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${APP_JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

  redis:
    chat-memory:
      database: ${APP_REDIS_CHAT_MEMORY_DATABASE:1}
      ttl-hours: ${APP_REDIS_CHAT_MEMORY_TTL_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
